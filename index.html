<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="container">
  <div class="card">
    <div class="card_img">
      <img src="./assets/images/illustration-article.svg" alt="illustration-article" class="card_illustration">
    </div>
    <div class="card_content">
      <p class="card_category">Learning</p>
      <p class="card_date">Published 21 Dec 2023</p>
      <h1 class="card_title">HTML & CSS foundations</h1>
      <p class="card_description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
    </div>
    <div class="card_author">
      <img src="./assets/images/image-avatar.webp" alt="avatar-greg" class="card_avatar">
      <p class="card_author_name">Greg Hooper</p>
    </div>
  </div>
</main>
</body>
</html>
